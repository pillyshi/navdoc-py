[project]
name = "navdoc"
version = "0.2.6"
description = "Python SDK for navdoc – RAG-powered chat with Claude via the navdoc REST API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "pillyshi" }]
requires-python = ">=3.11"
keywords = ["navdoc", "mcp", "rag", "claude", "anthropic", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.28.0",
    "typer>=0.12.0",
    "prompt-toolkit>=3.0",
]

[project.scripts]
navdoc = "navdoc.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]
